appId: pt.agrafametal.app
productName: Agrafametal
copyright: Copyright © 2026 Agrafametal, Lda.
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!branding/*'
  - '!popular_db.py'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,LEIA-ME.md,LEIA-ME.pdf}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
# O better-sqlite3 (v13) já traz binários N-API prontos para Windows/macOS/Linux,
# compatíveis com o Electron: não é preciso recompilar (nem Visual Studio no PC).
npmRebuild: false

# ---------- Windows ----------
win:
  executableName: Agrafametal
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# Instalador: Agrafametal-1.0.0-setup.exe
nsis:
  artifactName: Agrafametal-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Agrafametal
  uninstallDisplayName: Agrafametal
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false

# Versão portátil (disco externo): Agrafametal-1.0.0-portable.exe
portable:
  artifactName: Agrafametal-${version}-portable.${ext}

# ---------- macOS / Linux (não usados pelo cliente, mantidos para desenvolvimento) ----------
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: Agrafametal-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Agrafametal
  category: Office
appImage:
  artifactName: Agrafametal-${version}.${ext}

# Sem atualizações automáticas (a app é distribuída manualmente)
publish: null
